name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Сторонние действия закреплены по SHA коммита; версия — в комментарии.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Ядра нужны тестам: сгенерированные конфиги проверяются настоящим xray run -test.
      - name: Fetch and verify cores
        run: |
          dotnet run tools/cores/fetch-cores.cs -- --platform all
          dotnet run tools/cores/fetch-cores.cs -- --platform all --verify

      - name: Test
        run: dotnet test --no-build --configuration Release
        env:
          # Раннер одноразовый: разрешаем тестам менять системный прокси (локально они пропускаются).
          KHORS_SYSTEM_PROXY_TESTS: "1"

      # Переносимый пакет для живой проверки на другом компьютере (docs/testing/devcli-*.md).
      - name: Package DevCli for live testing
        shell: pwsh
        run: |
          dotnet publish tools/Khors.DevCli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/devcli-win-x64
          New-Item -ItemType Directory -Force artifacts/devcli-win-x64/cores | Out-Null
          Copy-Item -Recurse cores/win-x64/xray artifacts/devcli-win-x64/cores/
          Get-Content docs/testing/devcli-1.4.md, docs/testing/devcli-1.5.md -Encoding utf8 | Set-Content artifacts/devcli-win-x64/README.md -Encoding utf8

      - name: Package KHORS Desktop for live testing
        shell: pwsh
        run: |
          dotnet publish src/Khors.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/khors-desktop-win-x64
          New-Item -ItemType Directory -Force artifacts/khors-desktop-win-x64/cores | Out-Null
          Copy-Item -Recurse cores/win-x64/xray artifacts/khors-desktop-win-x64/cores/
          Copy-Item -Recurse cores/win-x64/sing-box artifacts/khors-desktop-win-x64/cores/
          Get-Content docs/testing/app-1.6.md, docs/testing/app-1.8.md, docs/testing/app-2.1.md, docs/testing/app-2.4.md, docs/testing/app-2.5.md -Encoding utf8 | Set-Content artifacts/khors-desktop-win-x64/README.md -Encoding utf8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: khors-desktop-win-x64
          path: artifacts/khors-desktop-win-x64
          if-no-files-found: error
          retention-days: 14

      # Раннер одноразовый: проверяем сквозной сценарий «KHORS убит → прокси вернулся».
      - name: Test system proxy watchdog
        shell: pwsh
        run: ./tools/ci/test-proxy-watchdog.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: khors-devcli-win-x64
          path: artifacts/devcli-win-x64
          if-no-files-found: error
          retention-days: 14
